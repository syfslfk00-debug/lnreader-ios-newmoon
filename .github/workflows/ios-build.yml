name: iOS IPA Build

# ---------------------------------------------------------------------------
# ISOLATED PIPELINE: quality gate -> unsigned device IPA.
# Contains NO simulator steps. If this workflow is green, the IPA artifact
# is ready for download. Simulator tests live in ios-simulator-test.yml and
# run independently (their failure never blocks IPA production).
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
  push:
    branches:
      - ios-port
      - fix/ios-rtl-newmoon-reader-port
      - fix/v3-reader-translation-ios
    paths-ignore:
      - 'docs/**'
      - '**.md'

concurrency:
  group: ios-ipa-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  CI: 'true'
  EXPO_NO_TELEMETRY: '1'
  GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. Quality gate (Linux): lint + types + jest + real-source plugin test
  # ---------------------------------------------------------------------------
  quality:
    name: Lint · Types · Tests · Plugin Smoke (real sources)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        run: npm install -g pnpm@11.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate build env
        run: pnpm run generate:env:debug

      - name: Lint
        run: pnpm run lint

      - name: Check reader formatter
        run: pnpm run check:reader-formatter

      - name: Type-check
        run: pnpm run type-check

      - name: Unit tests (db + rn)
        run: pnpm test

      - name: 'Plugin engine smoke test (real sources: EN/ZH/AR/JP)'
        run: node scripts/plugin-smoke-test.mjs --out plugin-test-results

      - name: Upload plugin test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-smoke-results
          path: plugin-test-results/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 2. Unsigned device IPA (macOS): build for arm64 iPhones/iPads, verify, ship
  # ---------------------------------------------------------------------------
  build-ipa:
    name: Unsigned Device IPA (arm64 · Release)
    needs: quality
    runs-on: macos-26
    timeout-minutes: 150

    env:
      NODE_ENV: 'production'
      BUNDLE_ID: com.rajarsheechatterjee.LNReader

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The Expo 57 dependency tree ships SPM packages that declare
      # swift-tools-version 6.2 (e.g. package 'apple' inside React Native).
      # macos-26 images default to Xcode 16.4 (Swift tools 6.1) -> the inner
      # ExpoModulesJSI xcframework script phase fails with:
      #   "package 'apple' is using Swift tools version 6.2.0 but the
      #    installed version is 6.1.0"
      # So we must pin an Xcode 26 release BEFORE pod install / xcodebuild.
      - name: Select Xcode 26 + install iOS platform
        run: |
          set -e
          PREFERRED="/Applications/Xcode_26.1.1.app"
          if [ ! -d "$PREFERRED" ]; then
            PREFERRED=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          fi
          if [ -z "$PREFERRED" ] || [ ! -d "$PREFERRED" ]; then
            echo "No Xcode 26 found"; ls /Applications | grep -i xcode; exit 1
          fi
          echo "Selecting: $PREFERRED"
          sudo xcode-select -s "$PREFERRED"
          xcodebuild -version
          # Xcode 26 on this image ships WITHOUT the iOS platform components
          # (Apple's on-demand platform downloads). Without this, any device
          # build fails with exit 70:
          #   "error:iOS 26.1 is not installed. Please download and install
          #    the platform from Xcode > Settings > Components."
          sudo xcodebuild -runFirstLaunch || true
          # Fresh runners occasionally have a wedged CoreSimulatorService
          # ("Unable to connect to simulator" from -downloadPlatform — runs
          # #17/#18 failed transiently at exactly this point). Restart it.
          sudo launchctl kickstart -k system/com.apple.CoreSimulator.CoreSimulatorService || true
          sleep 10
          # Installs device+simulator platform SDKs; idempotent when present.
          for ATTEMPT in 1 2 3; do
            if xcodebuild -downloadPlatform iOS; then
              echo "iOS platform installed/verified (attempt $ATTEMPT) ✓"
              break
            fi
            if [ "$ATTEMPT" = "3" ]; then
              echo "::error::xcodebuild -downloadPlatform iOS failed after 3 attempts"
              exit 1
            fi
            echo "attempt $ATTEMPT failed — retrying in 30s"
            sleep 30
          done
          echo "== iphoneos SDK ==" && xcodebuild -version -sdk iphoneos

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        run: npm install -g pnpm@11.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate build env (Release)
        env:
          MYANIMELIST_CLIENT_ID: ${{ vars.MYANIMELIST_CLIENT_ID }}
          ANILIST_CLIENT_ID: ${{ vars.ANILIST_CLIENT_ID }}
        run: pnpm run generate:env:release

      - name: Expo prebuild (iOS, CNG)
        run: pnpm exec expo prebuild --platform ios --no-install

      - name: Pod install
        run: |
          set -o pipefail
          cd ios
          pod install 2>&1 | tee pod-install.log

      - name: Build unsigned device app (arm64, Release)
        run: |
          set -o pipefail
          cd ios
          xcodebuild \
            -workspace LNReader.xcworkspace \
            -scheme LNReader \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ../build-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee ../xcodebuild-device.log | xcbeautify --renderer github-actions
          # Real gate: the .app must exist AND be complete (not a partial
          # bundle left behind by a failed build).
          APP=../build-device/Build/Products/Release-iphoneos/LNReader.app
          test -d "$APP"
          test -f "$APP/LNReader"      # main executable
          test -f "$APP/Info.plist"
          test -f "$APP/main.jsbundle" # RN bundle was produced

      - name: Assert reader WebView assets are bundled (device app)
        run: |
          APP=build-device/Build/Products/Release-iphoneos/LNReader.app
          test -d "$APP/ReaderAssets" || { echo "MISSING ReaderAssets"; ls "$APP"; exit 1; }
          test -f "$APP/ReaderAssets/css/index.css" || { echo "MISSING css"; exit 1; }
          test -f "$APP/ReaderAssets/js/core.js"    || { echo "MISSING js"; exit 1; }
          test -f "$APP/ReaderAssets/fonts/lato.ttf" || { echo "MISSING fonts"; exit 1; }
          echo "ReaderAssets present in device app bundle ✓"

      - name: Package unsigned IPA
        run: |
          mkdir -p artifacts/ipa Payload
          cp -R build-device/Build/Products/Release-iphoneos/LNReader.app Payload/
          zip -qry "artifacts/ipa/LNReader-ios-unsigned.ipa" Payload

      - name: Verify IPA (structure · arch · plist · unsigned)
        run: |
          IPA=artifacts/ipa/LNReader-ios-unsigned.ipa
          APP=Payload/LNReader.app

          echo "== Payload structure =="
          test -d "$APP" && echo "Payload/LNReader.app present ✓"

          echo "== Architectures (must be arm64 only) =="
          lipo -info "$APP/LNReader"
          lipo -info "$APP/LNReader" | grep -q arm64 || { echo "NOT arm64"; exit 1; }
          if lipo -info "$APP/LNReader" | grep -q x86_64; then echo "ERROR: simulator arch leaked into device build"; exit 1; fi

          echo "== Info.plist =="
          MIN_OS=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          echo "MinimumOSVersion=$MIN_OS bundle=$BUNDLE version=$VERSION"
          python3 -c "import sys; sys.exit(0 if tuple(int(x) for x in '$MIN_OS'.split('.')) <= (18,5,0) else 1)" \
            || { echo "MinimumOSVersion above iPadOS 18.5"; exit 1; }

          echo "== Not signed (unsigned IPA) =="
          codesign -dv "$APP" 2>&1 | grep -qi "linked and embedded" && { echo "Unexpected signature"; exit 1; } || echo "Unsigned ✓"

          echo "== Simulator frameworks must not be linked =="
          OTU=$(otool -L "$APP/LNReader")
          echo "$OTU" | grep -qi "iphonesimulator" && { echo "ERROR: simulator runtime linkage"; exit 1; } || echo "No simulator linkage ✓"

          echo "== Size =="
          SIZE_MB=$(du -m "$IPA" | cut -f1)
          echo "IPA size: ${SIZE_MB} MB"
          test "$SIZE_MB" -lt 500 || { echo "IPA unexpectedly large"; exit 1; }
          {
            echo "MIN_OS=$MIN_OS"
            echo "BUNDLE_ID=$BUNDLE"
            echo "VERSION=$VERSION"
            echo "SIZE_MB=$SIZE_MB"
            echo "IPA_SHA256=$(shasum -a 256 "$IPA" | cut -d' ' -f1)"
          } > artifacts/ipa-meta.txt
          cat artifacts/ipa-meta.txt

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: LNReader-ios-unsigned-ipa
          path: artifacts/ipa/LNReader-ios-unsigned.ipa
          retention-days: 30

      - name: Upload IPA metadata
        uses: actions/upload-artifact@v4
        with:
          name: LNReader-ipa-meta
          path: artifacts/ipa-meta.txt
          retention-days: 30

      - name: Upload build logs (on failure and success)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-build-logs
          path: |
            ios/pod-install.log
            xcodebuild-device.log
          retention-days: 30

  simulator-verification:
    name: Verify the same commit on iOS Simulator
    needs: build-ipa
    uses: ./.github/workflows/ios-simulator-test.yml
